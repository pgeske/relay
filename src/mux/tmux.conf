# relay's tmux configuration.
#
# relay runs its own tmux server (`tmux -L relay`) started with this file instead of
# ~/.tmux.conf, so personal tmux settings never change how relay looks or behaves.
# The relay binary writes this file on every run; edit the copy in the relay repo.

# -- general -------------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB,xterm-256color:RGB,*:hyperlinks"
set -as terminal-overrides ",*256col*:Tc"
set -s escape-time 10
set -s focus-events on
set -s extended-keys on
# -q skips options older tmux lacks (extended-keys-format is 3.5+, allow-passthrough 3.3+).
set -sq extended-keys-format csi-u
set -g repeat-time 600
set -g history-limit 10000
set -g mouse on
set -g status-keys vi
setw -g mode-keys vi
setw -gq allow-passthrough on
set -g set-titles on
set -g set-titles-string "#h ❐ #S ● #I #W"
set -g display-time 1000
set -g display-panes-time 800
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Keep omp's "turn finished" bell as a tab flag, never an audible beep.
setw -g monitor-bell on
set -g bell-action none

# -- prefix: Ctrl+B and Ctrl+A ---------------------------------------------------
set -g prefix2 C-a
bind C-a send-prefix -2

# -- agents --------------------------------------------------------------------
# Ctrl+N opens a new omp agent in the current pane's directory.
bind -n C-n new-window -c "#{pane_current_path}" omp
# Ctrl+K (or prefix k) picks a tab from a list that shows each agent's status.
bind -n C-k choose-tree -Zw -F "#{window_name} #{E:@omp_status}"
bind k choose-tree -Zw -F "#{window_name} #{E:@omp_status}"
# Alt+Shift+[ / ] switch tabs.
bind -n "M-{" previous-window
bind -n "M-}" next-window
bind -r C-h previous-window
bind -r C-l next-window
bind Tab last-window
bind & kill-window

# -- panes ---------------------------------------------------------------------
bind -n C-] resize-pane -Z
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -h -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind > swap-pane -D
bind < swap-pane -U
bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2
bind p display-panes
bind Enter copy-mode
bind -n C-l send-keys C-l \; run-shell "sleep 0.2" \; clear-history

# -- copy mode -----------------------------------------------------------------
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi H send -X start-of-line
bind -T copy-mode-vi L send -X end-of-line
bind -n WheelUpPane if-shell -Ft= "#{mouse_any_flag}" "send-keys -M" "if-shell -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e; send-keys -M'"
bind -n WheelDownPane if-shell -Ft= "#{mouse_any_flag}" "send-keys -M" "send-keys -M"

# -- omp status marks ------------------------------------------------------------
# omp titles its pane "π > <title>" when idle and "π <spinner> <title>" while working.
# Each tab ends with omp's spinner (yellow) while it works, a green dot when a turn
# finished in a tab you are not looking at, and nothing once you have seen it.
set -g @omp_frame '#{=1:#{P:#{?#{m/r:^π [^ >!]+( |$),#{pane_title}},#{s/^π //:pane_title},}}}'
set -g @omp_spinner '#{s/⠏/⠖/:#{s/⠇/⠆/:#{s/⠧/⠦/:#{s/⠼/⠴/:#{s/⠸/⠰/:#{s/⠹/⠲/:#{s/⠙/⠒/:#{s/⠋/⠒/:#{s/⠦/⠤/:#{s/⠴/⠤/:#{E:@omp_frame}}}}}}}}}}}'
set -g @omp_status '#{?#{E:@omp_spinner},#{?window_active,,#[fg=#e5c890]}#{E:@omp_spinner},#{?#{&&:#{window_bell_flag},#{!:#{window_active}}},#[fg=#a6d189]●, }}'
setw -g automatic-rename on
setw -g automatic-rename-format '#{?pane_in_mode,[tmux],#{?#{==:#{pane_current_command},omp},#{s/^π(. | [^ ]+ )//:pane_title},#{pane_current_command}}}#{?pane_dead,[dead],}'

# -- theme (Catppuccin Frappé) -----------------------------------------------------
set -g status on
set -g status-position top
set -g status-interval 10
set -g status-style 'fg=#c6d0f5,bg=#292c3c,none,underscore,us=#737994'
set -g status-left ''
set -g status-left-length 0
# relay sets @relay_update when a newer release is out.
set -g status-right '#{?@relay_update,#[fg=#e5c890]#{@relay_update} ,}'
set -g status-right-length 80
setw -g window-status-separator ''
setw -g window-status-format ' #{=/15/…;p16:#{window_name}} #{E:@omp_status}#[fg=#737994]▕'
setw -g window-status-current-format ' #{=/15/…;p16:#{window_name}} #{E:@omp_status}#[fg=#737994]▕'
setw -g window-status-style 'fg=#c6d0f5,bg=#51576d,none,underscore,us=#737994'
setw -g window-status-current-style 'fg=#303446,bg=#8caaee,bold,underscore,us=#737994'
setw -g window-status-activity-style 'fg=#c6d0f5,bg=#51576d,none,underscore,us=#737994'
setw -g window-status-last-style 'fg=#c6d0f5,bg=#51576d,none,underscore,us=#737994'
setw -g window-status-bell-style 'fg=#c6d0f5,bg=#51576d,none,underscore,us=#737994'
set -g message-style 'fg=#080808,bg=#ffff00,bold'
set -g message-command-style 'fg=#ffff00,bg=#080808,bold'
setw -g mode-style 'fg=#303446,bg=#8caaee,bold'
setw -g clock-mode-colour '#00afff'
setw -g clock-mode-style 24
set -g display-panes-colour 'colour238'
set -g display-panes-active-colour 'colour61'
setw -g pane-border-status off
setw -g pane-border-style 'fg=#51576d,bg=#303446'
setw -g pane-active-border-style 'fg=#8caaee,bg=#303446'
set -g window-style 'fg=#c6d0f5,bg=#303446'
set -g window-active-style 'fg=#c6d0f5,bg=#303446'
