name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    # macOS so the darwin binaries can be ad-hoc signed; Apple Silicon refuses unsigned ones.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Tag matches package.json version
        run: test "v$(jq -r .version package.json)" = "$GITHUB_REF_NAME"
      - run: bun run typecheck
      - run: bun test
      - name: Build binaries
        run: |
          mkdir -p dist
          for target in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            bun build src/cli.ts --compile --minify --target="bun-$target" --outfile "dist/relay-$target"
          done
          codesign --force --sign - dist/relay-darwin-arm64 dist/relay-darwin-x64
          (cd dist && shasum -a 256 relay-* > checksums.txt)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
